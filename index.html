<style>
  :root{
    --bg:#0f1420; --panel:#1a2233; --panel2:#222c42;
    --line:#33405e; --txt:#e8eef7; --dim:#93a0bd;
    --p0:#4facfe; --p0d:#2d7fe0; --p1:#ff6b6b; --p1d:#d43d3d;
    --ok:#35d07f; --bad:#ff5c5c; --accent:#ffd166;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{

  }
  #app{
    height:100%; height:100dvh;
    max-width:1100px; margin:0 auto; padding:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  header h1{font-size:clamp(17px,4.6vw,22px); letter-spacing:1px;}
  .tag{font-size:11px; color:var(--dim); background:var(--panel); padding:3px 8px; border-radius:20px; white-space:nowrap;}
  #statusBar{flex:1; text-align:right; font-size:clamp(12px,3.2vw,14px); color:var(--dim); min-width:120px;}
  .layout{display:flex; gap:10px; flex:1 1 auto; min-height:0;}
  @media (max-width:760px){ .layout{flex-direction:column;} }

  .boardWrap{
    background:var(--panel); border-radius:14px; padding:10px; position:relative;
    flex:1 1 auto; min-width:0; min-height:0;
    display:flex; align-items:center; justify-content:center;
  }
  .board{
    display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(12,1fr);
    aspect-ratio:1/1; width:min(100%, 80vh); max-width:100%; max-height:100%;
    gap:2px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:2px;
    touch-action:none;                 /* 棋盘上禁手势，避免拖动页面 */
  }
  .cell{position:relative; border-radius:2px; background:#1c2638; transition:background .06s;}
  .cell.empty{background:#26314b;}
  .cell.empty:hover{background:#31405f;}
  .cell.anchor{border:2px solid var(--ok); background:#1f5136; cursor:pointer;}
  .cell.anchor:hover{background:#2a6b47;}
  /* 合法锚点（方块左上角）画一个小圆点，明确「这里可以落」 */
  .cell.anchor::after{
    content:""; position:absolute; left:50%; top:50%; width:5px; height:5px;
    transform:translate(-50%,-50%); border-radius:50%; background:rgba(53,208,127,.9); pointer-events:none;
  }
  .cell.placed0{background:var(--p0); box-shadow:inset 0 0 0 1px var(--p0d);}
  .cell.placed1{background:var(--p1); box-shadow:inset 0 0 0 1px var(--p1d);}
  .cell.mvsrc{border:2px solid var(--accent); cursor:pointer;}
  .cell.mvsrc:hover{background:#7a6426;}
  .cell.mvnomove{outline:2px dashed rgba(255,209,102,.4); outline-offset:-3px;}  /* 对手方块但无安全落点：仍可点，点了解释原因 */
  .cell.mvtgt{border:2px solid var(--accent); cursor:pointer; background:#5a4a1f;}
  .cell.mvtgt:hover{background:#7a6426;}
  /* 落子幽灵：与点击落点严格一致（鼠标所在格 = 方块左上角） */
  .cell.ghost{background:rgba(86,165,255,.30); box-shadow:inset 0 0 0 2px #56a5ff;}
  .cell.ghost.origin{box-shadow:inset 0 0 0 3px #9ecbff;}
  .cell.ghost.origin::before{
    content:""; position:absolute; left:2px; top:2px; width:0; height:0;
    border-left:6px solid #9ecbff; border-bottom:6px solid transparent; pointer-events:none;
  }
  /* 移动目标幽灵 */
  .cell.ghostmv{background:rgba(255,209,102,.30); box-shadow:inset 0 0 0 2px var(--accent);}
  .cell.ghostmv.origin{box-shadow:inset 0 0 0 3px #ffe29a;}
  .cell.hoverSrc{outline:2px dashed var(--accent); outline-offset:-3px;}

  .panel{background:var(--panel); border-radius:14px; padding:12px; flex:0 0 320px; max-width:42%; overflow:auto; touch-action:pan-y;}
  @media (max-width:760px){ .panel{flex:0 0 auto; max-width:100%; max-height:38%;} }
  .panel h3{font-size:14px; color:var(--dim); margin-bottom:8px; letter-spacing:1px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .playerCard{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:var(--panel2);}
  .playerCard.active{box-shadow:0 0 0 2px var(--accent);}
  .pname{font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center;}
  .pname .count{font-size:12px; color:var(--dim);}
  .pieceInfo{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .sq{display:grid; grid-template-columns:repeat(4,12px); grid-template-rows:repeat(4,12px); gap:1px;}
  .sq i{width:12px; height:12px; border-radius:2px; background:#33405e;}
  .sq i.f0{background:var(--p0);} .sq i.f1{background:var(--p1);}
  .pieceInfo .txt{font-size:13px; color:var(--dim); line-height:1.5;}
  .prow{display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px;}
  .prow .label{font-size:13px; color:var(--dim);}
  .chip{font-size:13px; padding:5px 12px; border-radius:6px; border:1px solid var(--line); cursor:pointer; background:var(--panel2);}
  .chip.ready{background:var(--p0d); color:#fff; border-color:var(--p0d);}
  .chip.live{background:var(--accent); color:#222; border-color:var(--accent);}
  .chip.off{opacity:.35; cursor:not-allowed;}
  .mustTip{margin-top:8px; font-size:12px; line-height:1.5; color:var(--accent);
    background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.45); border-radius:6px; padding:5px 8px;}
  .tip{font-size:12px; color:var(--dim); margin-top:8px; line-height:1.6;}

  #log{max-height:130px; overflow-y:auto; font-size:12px; color:var(--dim); margin-top:6px;}
  #log .t{color:var(--txt);} #log .p0c{color:var(--p0);} #log .p1c{color:var(--p1);}

  button.btn{background:var(--p0d); color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer;}
  button.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--txt);}
  .topRow{display:flex; gap:8px; flex-wrap:wrap;}
  .modeSel{display:flex; gap:6px;}
  .modeSel span{font-size:13px; color:var(--dim); cursor:pointer; padding:5px 10px; border:1px solid var(--line); border-radius:20px;}
  .modeSel span.on{background:var(--accent); color:#222; border-color:var(--accent);}

  .overlay{position:fixed; inset:0; background:rgba(10,14,24,.82); display:flex; align-items:center; justify-content:center; z-index:50;}
  .overlay.hidden{display:none;}
  .ovCard{background:var(--panel); border-radius:16px; padding:30px 40px; text-align:center; max-width:420px;}
  .ovCard h2{font-size:24px; margin-bottom:8px;}
  .ovCard p{color:var(--dim); font-size:13px; margin-bottom:18px;}
  .ovCard .row{display:flex; gap:10px; justify-content:center;}

<script>
/* ============================================================
   CONFIG — 唯一规则源（ruleset packing-duel-r2）
   ============================================================ */
const CONFIG = {
  ruleset_id: "packing-duel-r2.5",
  boardSize: 12,
  piece: 4,           // 清一色 4×4 大方块，无限个
  moveEvery: 2,       // 每放 N 次得 1 个「移动」token
  moveMax: 3,         // token 上限
  secondStartMove: 1  // 后手开局补 1 个移动 token（平衡）
};
const PLAYER_NAMES_HOT = ["蓝方", "红方"];   // 双人对阵：红蓝玩家
const PLAYER_NAMES_AI  = ["你",  "对手"];   // 对战 AI：你 / 对手
function nameOf(p){ return (mode==="ai" ? PLAYER_NAMES_AI : PLAYER_NAMES_HOT)[p]; }
const BS = CONFIG.boardSize, P = CONFIG.piece, MAXA = BS - P + 1; // 锚点 0..8

/* ============================================================
   状态
   ============================================================ */
let state = null;
let mode = "ai";
let ui = { move:false, srcBox:null, ghost:null, ghostMv:null, hoverSrc:null };
let history = [];

function newState(){
  return {
    board: Array.from({length:BS},()=>Array(BS).fill(null)),
    placed: {},
    seq:0,
    current:0,
    round:1,
    turnId:0,
    players: [
      { placedCount:0, moves:0 },
      { placedCount:0, moves:0 }
    ],
    over:false, winner:-1,
    mustPlace:false      // true = 本回合已用过「移动」，必须再落一个 4×4 才算结束（r2.3）
  };
}
function cloneState(s){
  return {
    board: s.board.map(r=>r.map(c=> c?{...c}:null)),
    placed: Object.fromEntries(Object.entries(s.placed).map(([k,v])=>[k,{...v, cells:v.cells.map(p=>[...p])}])),
    seq:s.seq, current:s.current, round:s.round, over:s.over, winner:s.winner,
    turnId:s.turnId,
    mustPlace:!!s.mustPlace,
    players: s.players.map(p=>({placedCount:p.placedCount, moves:p.moves}))
  };
}
function log(msg, cls=""){
  const d=document.getElementById("log");
  const line=document.createElement("div");
  line.innerHTML = `<span class="t">#${state?state.round:''} </span>${msg}`;
  line.className=cls;
  d.appendChild(line); d.scrollTop=d.scrollHeight;
  if(d.children.length>80) d.removeChild(d.firstChild);
}

/* ============================================================
   规则引擎
   ============================================================ */
function anchorCells(r,c){
  const out=[];
  for(let dr=0;dr<P;dr++)for(let dc=0;dc<P;dc++) out.push([r+dr,c+dc]);
  return out;
}
function inBoard(r,c){ return r>=0 && r<BS && c>=0 && c<BS; }
function validAnchor(r,c){
  if(r<0||c<0||r+P>BS||c+P>BS) return false;
  return anchorCells(r,c).every(([rr,cc])=> !state.board[rr][cc]);
}
function allAnchors(){
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++) if(validAnchor(r,c)) res.push([r,c]);
  return res;
}
function canPlaceAny(){ return allAnchors().length>0; }
// 移动道具：目标 = 把某个对手方块搬到 (r,c) 后能放下（忽略该方块自身占的格）
function moveTargets(boxId){
  const b = state.placed[boxId];
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(const [rr,cc] of anchorCells(r,c)){
      if(!inBoard(rr,cc)){ ok=false; break; }
      const cell=state.board[rr][cc];
      if(cell && cell.boxId!==boxId){ ok=false; break; }
    }
    if(ok){
      const same = b.cells.length===P*P && b.cells.every(p=> p[0]>=r&&p[0]<r+P&&p[1]>=c&&p[1]<c+P);
      if(!same) res.push([r,c]);
    }
  }
  return res;
}
function oppBoxes(player){
  return Object.values(state.placed).filter(b=>b.owner===1-player);
}
// r2.3 关键约束：移动之后必须还能落一个方块。
// 所以只有「搬完之后自己仍有落位」的目标才是合法目标 —— 搬完自己也没地方落的走法
// 等价于自杀，直接从可选目标里过滤掉（与「放不下就不预览」同一个原则）。
function safeMoveTargets(boxId){
  return moveTargets(boxId).filter(([r,c])=> moveLeavesPlace(boxId,r,c));
}
function canMoveNow(player){
  if(state.players[player].moves<=0) return false;
  return oppBoxes(player).some(b=> safeMoveTargets(b.boxId).length>0);
}
function canAct(player){
  if(canPlaceAny()) return true;
  return canMoveNow(player);
}

/* ---- 动作 ---- */
function doPlace(p, r, c){
  const cells = anchorCells(r,c);
  const id = `${p}:sq:${state.seq++}`;
  state.placed[id] = { boxId:id, owner:p, cells, locked:false };
  cells.forEach(([rr,cc])=> state.board[rr][cc]={ boxId:id, owner:p });
  state.players[p].placedCount++;
  if(state.players[p].placedCount % CONFIG.moveEvery === 0 && state.players[p].moves < CONFIG.moveMax){
    state.players[p].moves++;
    log(`<span class="p${p}c">${nameOf(p)}</span> 放下一个 4×4 于 (${r+1},${c+1})，获得 1 个移动 token`);
  } else {
    log(`<span class="p${p}c">${nameOf(p)}</span> 放下一个 4×4 于 (${r+1},${c+1})`);
  }
}
function doMove(player, boxId, r, c){
  const b = state.placed[boxId];
  b.cells.forEach(([rr,cc])=> state.board[rr][cc]=null);
  const cells = anchorCells(r,c);
  b.cells = cells;
  cells.forEach(([rr,cc])=> state.board[rr][cc]={ boxId, owner:b.owner });
  state.players[player].moves--;
  log(`<span class="p${player}c">${nameOf(player)}</span> 把对手的 4×4 搬到 (${r+1},${c+1})`);
  // 核心判定：移动后若仍无落位，该玩家直接判负
  if(!canPlaceAny()){
    state.over = true;
    state.winner = 1 - player;
    render(); showWin();
    return "lost";
  }
  return "ok";
}
// 模拟：某个移动完成后，当前玩家是否仍有落位
function moveLeavesPlace(boxId,r,c){
  const s=cloneState(state);
  const b=s.placed[boxId];
  b.cells.forEach(([rr,cc])=> s.board[rr][cc]=null);
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId,owner:b.owner});
  for(let rr=0;rr<MAXA;rr++)for(let cc=0;cc<MAXA;cc++){
    let ok=true;
    for(const [ar,ac] of anchorCells(rr,cc)){
      if(!inBoard(ar,ac)||s.board[ar][ac]){ ok=false; break; }
    }
    if(ok) return true;
  }
  return false;
}

/* ---- 回合推进 ---- */
function advance(){
  if(state.over) return;
  state.current = 1 - state.current;
  state.round++;
  state.turnId++;               // 新回合：turnId 自增，用于悔棋定位
  state.mustPlace = false;      // 不变量：新回合一定从「落牌之前」开始
  resetUi();
  if(!canAct(state.current)){
    state.over=true;
    state.winner = 1 - state.current;
    render(); showWin();
    return;
  }
  // 无法放置但有移动 token：只有这一条路，且移动后得立刻补落一手
  if(!canPlaceAny() && canMoveNow(state.current)){
    setTip("放不下 4×4 了：只剩「移动」这一条路 —— 搬开对手方块后，你得能<b>立刻补落一个</b>，否则判负。", true);
  }
  render();
  if(mode==="ai" && state.current===1 && !state.over){
    setTimeout(aiTurn, 520);
  }
}
// 悔棋快照：在「动作发生之前」记录当前局面，并打上 turnId。
// 同一回合内的多次动作（如「移动＋落子」连招）共享同一个 turnId，
// 这样一次 undo 就能把整手（含连招）完整退回，并交还给该手的主人。
function snapshot(){
  history.push({ turnId: state.turnId, s: cloneState(state) });
  if(history.length>80) history.shift();
}
function commitAction(){ advance(); }   // 仅推进回合；快照须由调用方在动作前调用

/* ---- AI（r2.4）----
   三层结构：
     1) 基础评分 scoreState = 锚点总数 ×1000 + 最大连通空域
        （双方同形，锚点公共，anchorsOn 分不出敌我，只能衡量空间）
     2) 候选生成：直接落子(~81 个) + 「移动+落子」连招（粗筛 Top-K 再深搜），
        连招要挣回 token 机会成本 AI_MOVE_COST 才值得
     3) 战术层 oppThreat（只看胜负级事件）：
        一手让对手无路 = 致胜手 (+WIN_TACTIC)，走出被将死的招 = (-WIN_TACTIC)  */
const AI_MOVE_COST = 6;   // 移动的机会成本，单位＝格数
const AI_TOPK = 8;        // 只对即时收益最好的 K 个移动候选做「移动+落子」深度搜索

function anchorsOn(s){
  let n=0;
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(let dr=0;dr<P&&ok;dr++)for(let dc=0;dc<P&&ok;dc++) if(s.board[r+dr][c+dc]) ok=false;
    if(ok) n++;
  }
  return n;
}
function canPlaceOn(s,r,c){
  for(let dr=0;dr<P;dr++)for(let dc=0;dc<P;dc++) if(s.board[r+dr][c+dc]) return false;
  return true;
}
function placeOn(s,r,c,owner){    // 原地修改模拟状态（AI=1，模拟对手落子传 0）
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId:"sim",owner:owner===undefined?1:owner});
  return s;
}
function simMove(boxId,r,c){
  const s=cloneState(state);
  const b=s.placed[boxId];
  b.cells.forEach(([rr,cc])=> s.board[rr][cc]=null);
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId,owner:b.owner});
  return s;
}
function scoreAfter(s){                // 局面里最大的一块连通空域
  const seen=new Set(); let max=0;
  for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){
    if(s.board[r][c] || seen.has(r+","+c)) continue;
    let q=[[r,c]],area=0; seen.add(r+","+c);
    while(q.length){ const [rr,cc]=q.pop(); area++;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
        const nr=rr+dr,nc=cc+dc;
        if(inBoard(nr,nc)&&!s.board[nr][nc]&&!seen.has(nr+","+nc)){ seen.add(nr+","+nc); q.push([nr,nc]); }
      });
    }
    if(area>max) max=area;
  }
  return max;
}
function scoreState(s){ return anchorsOn(s)*1000 + scoreAfter(s); }
/* ---- 战术层：一层对手回应 ----
   关键事实：双方方块同形，锚点是公共的 —— anchorsOn 分不出敌我，
   真正的攻防在「轮到谁时空间枯竭」。所以战术层只看胜负级事件：
     · 我这一手让对手无路（无落位且搬不出）→ 致胜手，巨大加分
     · 我这一手后对手存在反击让我无路     → 被将死，巨大减分   */
function anchorsList(s){
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(let dr=0;dr<P&&ok;dr++)for(let dc=0;dc<P&&ok;dc++) if(s.board[r+dr][c+dc]) ok=false;
    if(ok) res.push([r,c]);
  }
  return res;
}
function canEscape(s,player){     // player 当前无落位：能否靠「移动」开出落位
  if(s.players[player].moves<=0) return false;
  for(const b of Object.values(s.placed)){
    if(b.owner!==1-player) continue;
    for(const [r,c] of anchorsList(s)){
      let ok=true;
      for(const [rr,cc] of anchorCells(r,c)){ const cell=s.board[rr][cc]; if(cell && cell.boxId!==b.boxId){ ok=false; break; } }
      if(!ok) continue;
      const s2=cloneState(s);
      const bb=s2.placed[b.boxId];
      bb.cells.forEach(([rr,cc])=> s2.board[rr][cc]=null);
      anchorCells(r,c).forEach(([rr,cc])=> s2.board[rr][cc]={boxId:b.boxId,owner:bb.owner});
      if(anchorsOn(s2)>0) return true;
    }
  }
  return false;
}
const WIN_TACTIC = 100000;        // 战术层分值：直接决定取舍
function oppThreat(s){            // s = 我方动作全部完成、即将轮到对手的局面
  if(anchorsOn(s)===0){
    return canEscape(s,0) ? 0 : WIN_TACTIC;            // 对手彻底无路 → 致胜
  }
  // 对手是否存在一手让我陷入死局
  for(const [r,c] of anchorsList(s)){
    const s2=placeOn(cloneState(s),r,c,0);
    if(anchorsOn(s2)===0 && !canEscape(s2,1)) return -WIN_TACTIC;   // 我被将死
  }
  return 0;
}
function bestFollowUp(s){          // 给定局面下，AI 自己能落的最佳位置
  let ret=null;
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    if(!canPlaceOn(s,r,c)) continue;
    const sc=scoreState(placeOn(cloneState(s),r,c));
    if(!ret || sc>ret.score) ret={r,c,score:sc};
  }
  return ret;
}
function aiCandidates(){
  const list=[];
  for(const [r,c] of allAnchors()){
    const s1=placeOn(cloneState(state),r,c);
    list.push({type:'place', r, c, sAfter:s1, score:scoreState(s1)});
  }
  // 连招（移动＋落子）只在「自己已无处可落、被迫移动」时才考虑。
  // 能直接落子时，落子保留 token 永远更优——移动 token 是后手/劣势方的翻盘杠杆，
  // 不该在开局白白挪动对手刚放的方块。
  if(canMoveNow(1) && !canPlaceAny()){
    const rough=[];
    for(const b of oppBoxes(1)) for(const [mr,mc] of safeMoveTargets(b.boxId)){
      const s1=simMove(b.boxId,mr,mc);
      if(anchorsOn(s1)===0) continue;              // 兜底：自杀式移动不应出现
      rough.push({boxId:b.boxId, mr, mc, s1, score:scoreState(s1)});
    }
    rough.sort((x,y)=>y.score-x.score);            // 粗筛后再深搜，避免组合爆炸
    for(const cd of rough.slice(0,AI_TOPK)){
      const fu=bestFollowUp(cd.s1);
      if(fu) list.push({type:'combo', boxId:cd.boxId, mr:cd.mr, mc:cd.mc,
                        pr:fu.r, pc:fu.c, sAfter:placeOn(cloneState(cd.s1),fu.r,fu.c), score:fu.score});
    }
  }
  return list;
}
const AI_LOOKAHEAD = 4;   // 只对基础分最高的 N 个候选做对手回应检查
function aiTurn(){
  if(state.over) return;
  const cands=aiCandidates();
  if(!cands.length){ state.over=true; state.winner=0; render(); showWin(); return; }
  cands.sort((x,y)=>y.score-x.score);
  let best=null;
  cands.forEach((cd,i)=>{
    cd.final = cd.score - (cd.type==='combo'?AI_MOVE_COST:0)
             + (i<AI_LOOKAHEAD ? oppThreat(cd.sAfter) : 0);   // 战术层只看头部候选
    if(!best || cd.final>best.final) best=cd;
  });
  if(best.type==='combo'){
    snapshot();
    if(doMove(1, best.boxId, best.mr, best.mc)==="lost"){ resetUi(); return; }
    state.mustPlace=true; resetUi(); render();
    setTimeout(()=>{
      // 若期间被悔棋/重开，状态已变，放弃这手
      if(state.over || state.current!==1 || !state.mustPlace) return;
      if(!canPlaceOn(state, best.pr, best.pc)) return;
      snapshot();                                  // 连招第二手：与移动共享同一 turnId，整手可一次退回
      doPlace(1, best.pr, best.pc);
      state.mustPlace=false; resetUi(); advance();
    }, 520);
    return;
  }
  snapshot(); doPlace(1, best.r, best.c); resetUi(); advance();
}

/* ============================================================
   渲染
   ============================================================ */
const boardEl=document.getElementById("board");
function render(){ renderBoard(); renderPlayers(); renderStatus(); paintGhost(); fitBoard(); }
let _mvCache={};
function renderBoard(){
  boardEl.innerHTML="";
  _mvCache={};
  for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){
    const d=document.createElement("div");
    d.dataset.r=r; d.dataset.c=c;
    const cell=state.board[r][c];
    if(cell){
      d.className="cell placed"+cell.owner;
      if(ui.move && ui.srcBox===null && cell.owner===1-state.current){
        if(!(cell.boxId in _mvCache)) _mvCache[cell.boxId] = safeMoveTargets(cell.boxId).length>0;
        d.classList.add(_mvCache[cell.boxId] ? "mvsrc" : "mvnomove");
      }
      if(ui.move && ui.srcBox!==null && cell.boxId===ui.srcBox) d.classList.add("mvsrc");
    } else {
      d.className="cell empty";
      if(!ui.move && validAnchor(r,c)) d.classList.add("anchor");
      if(ui.move && ui.srcBox!==null && isMoveTargetCell(r,c)) d.classList.add("mvtgt");
    }
    d.addEventListener("click",()=> onCellClick(r,c));
    boardEl.appendChild(d);
  }
}
function isMoveTargetCell(r,c){
  if(!ui.srcBox) return false;
  for(const [rr,cc] of safeMoveTargets(ui.srcBox)){
    if(rr===r && cc===c) return true;
  }
  return false;
}
/* ---- 落子幽灵预览 ----
   规则：预览位置 == 点击后的真实落点。
   鼠标所在格 (r,c) 直接作为 4×4 的左上角；只有该位置能完整放下才画幽灵。
   放不下的位置一律不预览（所见即所得，点了必然能下）。            */
function updateGhost(r,c){
  ui.ghost=null; ui.ghostMv=null; ui.hoverSrc=null;
  const idle = state.over || (mode==="ai" && state.current===1);
  if(!idle && ui.move && ui.srcBox!==null){
    // 移动模式已选源方块：预览搬到 (r,c) 后的样子，同样只画合法目标
    if(safeMoveTargets(ui.srcBox).some(([rr,cc])=> rr===r && cc===c)) ui.ghostMv={r,c};
  } else if(!idle && ui.move){
    // 移动模式待选源：高亮鼠标下那个可被搬动的对手方块
    const cell=state.board[r][c];
    if(cell && cell.owner===1-state.current && safeMoveTargets(cell.boxId).length>0) ui.hoverSrc=cell.boxId;
  } else if(!idle && validAnchor(r,c)){
    ui.ghost={r,c};
  }
  paintGhost();
}
function paintGhost(){
  // 状态变化后旧的幽灵可能已失效（例如 AI 刚占了那块地）
  if(ui.ghost && !validAnchor(ui.ghost.r, ui.ghost.c)) ui.ghost=null;
  if(ui.ghostMv && ui.srcBox && !safeMoveTargets(ui.srcBox).some(([rr,cc])=>rr===ui.ghostMv.r&&cc===ui.ghostMv.c)) ui.ghostMv=null;
  const g = ui.ghost || ui.ghostMv;
  for(const d of boardEl.children){
    const rr=+d.dataset.r, cc=+d.dataset.c;
    const on = !!g && rr>=g.r && rr<g.r+P && cc>=g.c && cc<g.c+P;
    d.classList.toggle("ghost", !!ui.ghost && on);
    d.classList.toggle("ghostmv", !!ui.ghostMv && on);
    d.classList.toggle("origin", !!g && rr===g.r && cc===g.c);
    d.classList.toggle("hoverSrc", !!ui.hoverSrc && !!state.board[rr][cc] && state.board[rr][cc].boxId===ui.hoverSrc);
  }
}
// 让棋盘始终是「容器宽 / 容器高」中较小值的正方形 —— 适配任意窗口，不溢出、不滚动
function fitBoard(){
  const wrap = boardEl && boardEl.parentElement;
  if(!wrap) return;
  const cs = (typeof getComputedStyle==="function") ? getComputedStyle(wrap) : null;
  const padX = cs ? (parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)) : 20;
  const padY = cs ? (parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)) : 20;
  const availW = (wrap.clientWidth||wrap.offsetWidth||0) - padX;
  const availH = (wrap.clientHeight||wrap.offsetHeight||0) - padY;
  const size = Math.max(80, Math.floor(Math.min(availW, availH)));
  boardEl.style.width = size+"px";
  boardEl.style.height = size+"px";
}
if(typeof window!=="undefined"){
  window.addEventListener("resize", fitBoard);
  if(window.ResizeObserver && boardEl && boardEl.parentElement){ new ResizeObserver(fitBoard).observe(boardEl.parentElement); }
}
boardEl.addEventListener("mousemove", e=>{
  const d=e.target && e.target.closest ? e.target.closest(".cell") : null;
  if(d) updateGhost(+d.dataset.r, +d.dataset.c);
});
boardEl.addEventListener("mouseleave", ()=>{ ui.ghost=null; paintGhost(); });
boardEl.addEventListener("touchmove", e=>{
  if(e.touches.length===0) return;
  const t=e.touches[0];
  const el=document.elementFromPoint(t.clientX, t.clientY);
  const d=el && el.closest ? el.closest(".cell") : null;
  if(d) updateGhost(+d.dataset.r, +d.dataset.c);
}, {passive:true});
boardEl.addEventListener("touchend", ()=>{ ui.ghost=null; paintGhost(); });
function onCellClick(r,c){
  if(state.over) return;
  const p=state.current;
  if(mode==="ai" && p===1) return;
  if(state.mustPlace){
    if(ui.move){ ui.move=false; ui.srcBox=null; }
    if(state.board[r][c]){ tipErr("这里已经有方块了"); return; }
    if(!validAnchor(r,c)){ tipErr("这里放不下 4×4：请选择<b>带绿色圆点</b>的格子"); return; }
    snapshot(); doPlace(p, r, c); state.mustPlace=false; resetUi(); advance(); return;
  }
  if(ui.move){
    if(ui.srcBox===null){
      const cell=state.board[r][c];
      if(cell && cell.owner===1-p){
        if(safeMoveTargets(cell.boxId).length===0){
          tipErr("这枚方块搬走后你没地方落子（会判负），不能选它；换一枚<b>金色虚线</b>的可搬方块"); return;
        }
        ui.srcBox=cell.boxId;
        setTip("已选中对手的方块：再点一个<b>金色高亮</b>的位置把它搬过去（该格 = 新左上角）。");
        render(); return;
      }
      tipErr("请先点<b>对手</b>的方块（金色虚线框的那个）"); return;
    } else {
      if(safeMoveTargets(ui.srcBox).some(([rr,cc])=> rr===r && cc===c)){
        snapshot();                                  // 悔棋点：可退回移动之前
        const res = doMove(p, ui.srcBox, r, c);
        resetUi();
        if(res==="lost") return;                     // 移动后仍无落位：直接判负
        state.mustPlace=true;                        // 本回合还能再落一个方块
        setTip("移动完成 —— 同回合内你还要<b>再落一个 4×4</b>，落完才轮到对手。");
        render(); return;
      }
      tipErr("那里搬不过去：只能搬到<b>金色高亮</b>的空位");
      ui.srcBox=null; render(); return;
    }
  }
  if(state.board[r][c]){ tipErr("这里已经有方块了"); return; }
  if(!validAnchor(r,c)){
    tipErr(`这里放不下 4×4：以 (${r+1},${c+1}) 为左上角会越界或被占。请选择<b>带绿色圆点</b>的格子`);
    return;
  }
  snapshot(); doPlace(p, r, c); resetUi(); advance();
}
function renderPlayers(){
  [0,1].forEach(p=>{
    const card=document.getElementById("p"+p+"card");
    card.innerHTML="";
    card.className="playerCard"+(state.current===p?" active":"");
    const ph=state.players[p];
    const own = p===state.current && !(mode==="ai"&&p===1);
    const chained = state.mustPlace && state.current===p;   // 已用移动，正在等待补落的那一手
    card.innerHTML=`
      <div class="pname"><span>${nameOf(p)}</span>
        <span class="count">已放 ${ph.placedCount} · 移动 ${ph.moves}/${CONFIG.moveMax}</span></div>
      <div class="pieceInfo">
        <div class="sq">${Array.from({length:16},(_,i)=>`<i class="f${p}"></i>`).join("")}</div>
        <div class="txt">清一色 4×4 方块，无限个<br/>每放 ${CONFIG.moveEvery} 个得 1 移动 token</div>
      </div>
      <div class="prow">
        <span class="label">移动：</span>
        <button class="chip ${ui.move&&state.current===p?'live':(ph.moves>0&&own&&!chained?'ready':'off')}" data-p="${p}">移动×${ph.moves}</button>
      </div>
      ${chained?`<div class="mustTip">已用过移动 —— 再落一个 4×4 才结束回合</div>`:``}`;
    const btn=card.querySelector(".chip");
    btn.addEventListener("click",()=>{
      if(!own) return;
      if(chained){ flash(btn,"本回合已用过移动"); return; }
      if(ph.moves<=0){ flash(btn,"没有移动 token"); return; }
      if(oppBoxes(p).length===0){ flash(btn,"对手还没有方块"); return; }
      if(!canMoveNow(p)){ flash(btn,"没有可搬动的位置"); return; }
      ui.move=true; ui.srcBox=null;
      setTip("【移动】先点一个<b>对手</b>的方块（金色虚线框），再点一个<b>金色高亮</b>的空位把它搬过去。");
      render();
    });
  });
}
function flash(btn,msg){
  const old=btn.textContent; btn.textContent=msg; btn.style.background="var(--bad)";
  setTimeout(()=>{ btn.textContent=old; btn.style.background=""; },900);
}
const TIP_DEFAULT = "鼠标所在的格子就是 4×4 的<b>左上角</b>；带绿色描边与圆点的格子才放得下，幽灵只会出现在这些位置。每回合可以「移动＋落子」连招，也可以直接落子。";
function resetUi(){
  ui={ move:false, srcBox:null, ghost:null, ghostMv:null, hoverSrc:null };
  setTip(state && state.mustPlace
    ? "移动完成 —— 同回合内你还要<b>再落一个 4×4</b>，落完才轮到对手。"
    : TIP_DEFAULT);
}
function setTip(html, bad){
  const t=document.getElementById("boardTip");
  t.innerHTML=html;
  t.style.color = bad ? "var(--bad)" : "";
}
let tipTimer=null;
function tipErr(msg){
  setTip(msg, true);
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>setTip(TIP_DEFAULT), 1600);
}
function renderStatus(){
  const sb=document.getElementById("statusBar");
  const anchors = allAnchors().length;
  const phase = state.mustPlace
    ? ` · <b style="color:var(--accent)">移动后 · 须再落一子</b>`
    : "";
  sb.innerHTML = state.over
    ? `<b>${nameOf(state.winner)} 获胜（第 ${state.round} 回合）</b>`
    : `第 ${state.round} 回合 · 轮到 <b>${nameOf(state.current)}</b>${phase} · 可落锚点 <b style="color:${anchors? 'var(--ok)':'var(--bad)'}">${anchors}</b>`;
}
function showWin(){
  const p=state.winner;
  document.getElementById("winOverlay").classList.remove("hidden");
  document.getElementById("winTitle").textContent =
    mode==="hot" ? `🎉 ${nameOf(p)} 获胜` : (p===0?"🎉 你赢了":"🤝 对手获胜");
  document.getElementById("winDesc").textContent =
    `第 ${state.round} 回合，${nameOf(1-p)} 已放不下任何 4×4，${nameOf(p)} 获胜。`;
}

/* ============================================================
   控制
   ============================================================ */
function startGame(){
  history=[];
  state=newState();
  state.players[1].moves = CONFIG.secondStartMove; // 后手补 1 移动 token
  document.getElementById("winOverlay").classList.add("hidden");
  document.getElementById("log").innerHTML="";
  resetUi();
  render();
  log("对局开始：12×12 棋盘，双方无限个 4×4，放不下的一方判负。","");
}
document.getElementById("btnRestart").addEventListener("click", startGame);
document.getElementById("btnUndo").addEventListener("click", undo);
function undo(){
  if(history.length===0) return;
  let targetTurn;
  if(mode==="ai"){
    // 对战 AI：一路退回「人类（玩家0）最近一次行动之前」，把 AI 的回应一并退回
    let t=-1;
    for(const h of history) if(h.s.current===0) t=h.turnId;
    targetTurn=t;
  } else {
    // 双人对阵：退回最近完成的一手（不论红蓝），整手（含连招）一次退清
    targetTurn = history[history.length-1].turnId;
  }
  if(targetTurn<0) return;
  let idx=0;
  while(idx<history.length && history[idx].turnId!==targetTurn) idx++;
  if(idx>=history.length) return;
  const snap = history[idx];                 // 该手「行动之前」的起点
  history = history.slice(0, idx);           // 连同起点一起丢弃，起点即当前局面
  state = cloneState(snap.s);
  state.over=false;                          // 若上一手已判负，悔棋可救回
  state.winner=-1;
  document.getElementById("winOverlay").classList.add("hidden");
  resetUi(); render();
  log("悔棋：退回上一步之前","");
}
document.getElementById("btnAgain").addEventListener("click", ()=>{
  document.getElementById("winOverlay").classList.add("hidden");
  startGame();
});
document.getElementById("btnClose").addEventListener("click", ()=>{
  document.getElementById("winOverlay").classList.add("hidden");
});
document.getElementById("mAI").addEventListener("click", ()=>{ mode="ai"; setModeSel(); startGame(); });
document.getElementById("mHot").addEventListener("click", ()=>{ mode="hot"; setModeSel(); startGame(); });
function setModeSel(){
  document.getElementById("mAI").classList.toggle("on", mode==="ai");
  document.getElementById("mHot").classList.toggle("on", mode==="hot");
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ resetUi(); render(); }
});

startGame();
</script>
