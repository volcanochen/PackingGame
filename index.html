<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="GqlfPskQVkHOHCrjOepX3p">
<title>装箱对决 · 方块版 (r2.5)</title>
<style>
  :root{
    --bg:#0f1420; --panel:#1a2233; --panel2:#222c42;
    --line:#33405e; --txt:#e8eef7; --dim:#93a0bd;
    --p0:#4facfe; --p0d:#2d7fe0; --p1:#ff6b6b; --p1d:#d43d3d;
    --ok:#35d07f; --bad:#ff5c5c; --accent:#ffd166;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;  /* 深色背景上字体更清晰，不发糊 */
    overflow:hidden;                 /* 页面不滚动 */
    overscroll-behavior:none;         /* 禁下拉刷新 / 橡皮筋 */
    position:fixed; inset:0;          /* 禁单指拖动整页 */
    touch-action:none;                /* 禁手势缩放 / 滚动 */
    -webkit-text-size-adjust:100%;
  }
  #app{
    height:100%; height:100dvh;
    /* 注：不要给 #app 设 max-width —— 人为压窄内容区会把宽屏变成近方形，
       导致「棋盘最大化后没有剩余竖条」，信息只能折叠。现在宽度完全交给布局引擎。 */
    margin:0 auto; padding:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  header h1{font-size:clamp(17px,4.6vw,22px); letter-spacing:1px;}
  .tag{font-size:11px; color:var(--dim); background:var(--panel); padding:3px 8px; border-radius:20px; white-space:nowrap;}
  /* 注：#statusBar 旧规则（flex:1 + text-align:right）已删 —— 它会把状态区撑成 500px 高的空盒子 */
  .main{display:flex; gap:8px; flex:1 1 auto; min-height:0;}

  .boardWrap{
    background:var(--panel); border-radius:14px; padding:10px; position:relative;
    flex:1 1 auto; min-width:0; min-height:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .board{
    display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(12,1fr);
    aspect-ratio:1/1; width:auto; height:auto; max-width:100%; max-height:100%;
    gap:2px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:2px;
    touch-action:none;                 /* 棋盘上禁手势，避免拖动页面 */
  }
  .cell{position:relative; border-radius:2px; background:#1c2638; transition:background .06s;}
  .cell.empty{background:#26314b;}
  .cell.empty:hover{background:#31405f;}
  .cell.anchor{border:2px solid var(--ok); background:#1f5136; cursor:pointer;}
  .cell.anchor:hover{background:#2a6b47;}
  /* 合法锚点（方块左上角）画一个小圆点，明确「这里可以落」 */
  .cell.anchor::after{
    content:""; position:absolute; left:50%; top:50%; width:5px; height:5px;
    transform:translate(-50%,-50%); border-radius:50%; background:rgba(53,208,127,.9); pointer-events:none;
  }
  .cell.placed0{background:var(--p0);}
  .cell.placed1{background:var(--p1);}
  /* 落下方块：块内用玩家色（深一档，亮底上才看得见）画 2px 方格线；方块之间用黑色 2px 线分隔，黑线在最上层更显著 */
  .cell{--in:transparent; --blk:#000;}
  .cell.placed0{--in:var(--p0d);}
  .cell.placed1{--in:var(--p1d);}
  .cell.placed0, .cell.placed1{
    border-radius:0; position:relative;
    box-shadow:0 -2px 0 var(--in), 0 2px 0 var(--in), -2px 0 0 var(--in), 2px 0 0 var(--in);
  }
  /* 块边界（edge-*）：黑色线盖在间隙里，位于内部彩线之上 */
  .cell.edge-t::before, .cell.edge-b::before{content:""; position:absolute; left:0; right:0; height:2px; background:var(--blk); pointer-events:none; z-index:3;}
  .cell.edge-t::before{top:-2px;}
  .cell.edge-b::before{bottom:-2px;}
  .cell.edge-l::after, .cell.edge-r::after{content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--blk); pointer-events:none; z-index:3;}
  .cell.edge-l::after{left:-2px;}
  .cell.edge-r::after{right:-2px;}
  .cell.mvsrc{border:2px solid var(--accent); cursor:pointer;}
  .cell.mvsrc:hover{background:#7a6426;}
  .cell.mvnomove{outline:2px dashed rgba(255,209,102,.4); outline-offset:-3px;}  /* 对手方块但无安全落点：仍可点，点了解释原因 */
  .cell.mvtgt{border:2px solid var(--accent); cursor:pointer; background:#5a4a1f;}
  .cell.mvtgt:hover{background:#7a6426;}
  /* 落子幽灵：与点击落点严格一致（鼠标所在格 = 方块左上角） */
  .cell.ghost{background:rgba(86,165,255,.30); box-shadow:inset 0 0 0 2px #56a5ff;}
  .cell.ghost.origin{box-shadow:inset 0 0 0 3px #9ecbff;}
  .cell.ghost.origin::before{
    content:""; position:absolute; left:2px; top:2px; width:0; height:0;
    border-left:6px solid #9ecbff; border-bottom:6px solid transparent; pointer-events:none;
  }
  /* 移动目标幽灵 */
  .cell.ghostmv{background:rgba(255,209,102,.30); box-shadow:inset 0 0 0 2px var(--accent);}
  .cell.ghostmv.origin{box-shadow:inset 0 0 0 3px #ffe29a;}
  .cell.hoverSrc{outline:2px dashed var(--accent); outline-offset:-3px;}

  /* ——— 信息区：JS 先把棋盘放到最大正方形，再把「剩下的一条」空间分给它；
         剩条放不下时整块折叠成悬浮按钮，点开是浮层（dock-overlay） ——— */
  .infobar{
    display:flex; flex-direction:column; gap:6px; align-items:stretch;   /* 默认竖排：即使 JS 未跑，信息区也不会横着挤爆棋盘 */
    flex:0 0 auto; min-width:0; min-height:0;
    background:var(--panel); border-radius:12px; padding:8px;   /* 6 个小卡片合并成一个面板 */
    overflow-y:auto;      /* 信息比空间多时在内部滚动，绝不挤压棋盘 */
    overflow-x:hidden;
    touch-action:pan-y;   /* 移动端允许在信息区里手指滑动 */
  }
  .infobar.col{flex-direction:column;}
  .infobar.row{flex-direction:row; flex-wrap:wrap; align-content:flex-start;}
  .infobar.col .grp{width:100%;}
  /* 宽条里两列分配（ctrl/players、status/tip、tune/log），窄了自动退成单列 */
  .infobar.row .grp{width:auto; flex:1 1 calc(50% - 3px); min-width:210px;}
  .infobar.row .grp-status{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .infobar.row .grp-tip .tip{-webkit-line-clamp:3;}
  /* 提示最多两行，超出截断，高度可控 */
  .grp-tip .tip{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .grp{background:transparent; border-radius:8px; padding:3px 6px; display:flex; align-items:center; gap:8px;}
  .grp-ctrl{gap:6px;}
  .grp-players{justify-content:space-around; gap:6px; padding:6px 8px; flex-wrap:wrap;}
  .grp-status{flex:0 0 auto; min-width:0; font-size:12px; color:var(--dim); line-height:1.45; text-align:left;}
  .grp-status b{color:var(--txt);}
  .grp-tip{align-items:flex-start;}
  .grp-log{flex-direction:column; align-items:stretch; gap:4px; max-height:56px;}
  .pcard{display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:8px; border:1px solid transparent; font-size:13px; white-space:nowrap;}
  .pcard.active{background:var(--panel2); border-color:var(--accent);}
  .pcard .dot{width:12px; height:12px; border-radius:3px; flex:0 0 auto;}
  .pcard.f0 .dot{background:var(--p0);} .pcard.f1 .dot{background:var(--p1);}
  .pcard .pn{font-weight:700;}
  .pcard .pc{color:var(--dim); font-size:12px;}
  .pcard .chip{padding:3px 9px; font-size:12px; border-radius:6px;}
  .chip{font-size:13px; padding:5px 12px; border-radius:6px; border:1px solid var(--line); cursor:pointer; background:var(--panel2);}
  .chip.ready{background:var(--p0d); color:#fff; border-color:var(--p0d);}
  .chip.live{background:var(--accent); color:#222; border-color:var(--accent);}
  .chip.off{opacity:.35; cursor:not-allowed;}
  .mustTip{font-size:11px; line-height:1.3; color:var(--accent);
    background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.45); border-radius:6px; padding:2px 6px;}
  .tip{font-size:12px; color:var(--dim); line-height:1.5;}
  #log{max-height:48px; overflow-y:auto; font-size:11px; color:var(--dim); width:100%;}
  #log .t{color:var(--txt);} #log .p0c{color:var(--p0);} #log .p1c{color:var(--p1);}

  /* 注：原先按 orientation:portrait 切方向的媒体查询已删除 —— 停靠方向现在由 JS
     依据「棋盘最大化后剩余的那条空间」决定（Layout 模块），近方形窗口不会误判。 */

  /* ——— 可折叠调参面板 ——— */
  .grp-tune{align-items:flex-start;}
  details.tune{width:100%;}
  details.tune>summary{list-style:none; cursor:pointer; font-size:13px; font-weight:700; color:var(--dim); user-select:none; display:flex; align-items:center; gap:6px;}
  details.tune>summary::-webkit-details-marker{display:none;}
  details.tune>summary::before{content:"\25B8"; display:inline-block; transition:transform .15s; color:var(--dim);}
  details.tune[open]>summary::before{transform:rotate(90deg);}
  details.tune>summary:hover{color:var(--txt);}
  .tuneBody{margin-top:10px; display:flex; flex-direction:column; gap:7px;}
  .trow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim);}
  .trow .nm{flex:1 1 auto; min-width:0; color:var(--txt); white-space:nowrap;}
  .trow input[type=range]{flex:0 0 92px; width:92px; accent-color:var(--p0); cursor:pointer;}
  .trow .val{flex:0 0 26px; text-align:right; color:var(--accent); font-variant-numeric:tabular-nums;}
  .trow .chip{padding:3px 8px; font-size:12px;}
  .tuneHint{font-size:11px; color:var(--dim); line-height:1.45;}

  button.btn{background:var(--p0d); color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer;}
  button.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--txt);}
  button.btn.sm{padding:7px 11px; font-size:13px;}
  .modeSel{display:flex; gap:6px;}
  .modeSel span{font-size:13px; color:var(--dim); cursor:pointer; padding:5px 10px; border:1px solid var(--line); border-radius:20px;}
  .modeSel span.on{background:var(--accent); color:#222; border-color:var(--accent);}

  .overlay{position:fixed; inset:0; background:rgba(10,14,24,.82); display:flex; align-items:center; justify-content:center; z-index:50;}
  .overlay.hidden{display:none;}
  .ovCard{background:var(--panel); border-radius:16px; padding:30px 40px; text-align:center; max-width:420px;}
  .ovCard h2{font-size:24px; margin-bottom:8px;}
  .ovCard p{color:var(--dim); font-size:13px; margin-bottom:18px;}
  .ovCard .row{display:flex; gap:10px; justify-content:center;}

  /* ——— 折叠态：信息区收进悬浮按钮 + 浮层（棋盘独占全部空间）——— */
  #infoToggle{
    position:fixed; right:16px; bottom:16px; z-index:45; display:none;
    align-items:center; gap:6px; font-family:inherit; font-size:14px; color:#fff;
    background:var(--p0d); border:none; border-radius:26px; padding:11px 18px; cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
  }
  #app.dock-overlay #infoToggle{display:inline-flex;}
  #infoOverlay{
    /* 底部贴边 overlay：不居中、不全屏遮罩，允许稍微盖住棋盘下边缘；
       容器 pointer-events:none —— 面板以外区域照常可点棋盘 */
    position:fixed; left:10px; right:10px; bottom:10px; z-index:60; display:none;
    align-items:flex-end; justify-content:center; pointer-events:none;
  }
  #infoOverlay.open{display:flex;}
  #infoOverlay .ovPanel{
    pointer-events:auto; position:relative;
    background:rgba(26,34,51,.97); border:1px solid var(--line); border-radius:14px; padding:8px;
    width:min(1020px,100%); max-height:min(52dvh,52vh);
    display:flex; flex-direction:column; gap:6px; overflow:hidden;
    box-shadow:0 14px 36px rgba(0,0,0,.55);
  }
  #infoOverlay .ovHead{display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:12px; color:var(--dim); min-height:22px;}
  #infoOverlay .ovBody{flex:1 1 auto; min-height:0; display:flex; overflow:hidden;}
  #infoOverlay .ovBody > .infobar{flex:1 1 auto; min-width:0; background:transparent; padding:0; border-radius:0;}
</style>

<script>
/* ============================================================
   CONFIG — 唯一规则源（ruleset packing-duel-r2）
   ============================================================ */
const CONFIG = {
  ruleset_id: "packing-duel-r2.5",
  boardSize: 12,       // 棋盘边长 12–18（调参面板可调）
  piece: 4,            // 方块边长 3–5（调参面板可调），无限个
  moveEvery: 2,        // 每放 N 次得 1 个「移动」token
  moveMax: 3,          // token 上限
  secondStartMove: 1,  // 后手开局补 1 个移动 token（平衡）
};
const CONFIG_DEFAULTS = { ...CONFIG };   // 「恢复默认」用
const PLAYER_NAMES_HOT = ["蓝方", "红方"];   // 双人对阵：红蓝玩家
const PLAYER_NAMES_AI  = ["你",  "对手"];   // 对战 AI：你 / 对手
function nameOf(p){ return (mode==="ai" ? PLAYER_NAMES_AI : PLAYER_NAMES_HOT)[p]; }
// BS / P / MAXA 由 CONFIG 推导；改棋盘或方块大小后必须调用 recalcDims()
let BS, P, MAXA;
function recalcDims(){ BS = CONFIG.boardSize; P = CONFIG.piece; MAXA = BS - P + 1; }
recalcDims();

/* ============================================================
   音效：Web Audio 实时合成（零外部资源，离线可用）
   注意浏览器自动播放策略：AudioContext 须在首个用户手势后才能 resume
   ============================================================ */
const Sfx = (function(){
  let ctx=null, master=null, on=true, vol=0.5;
  function ctxGet(){
    if(ctx) return ctx;
    try{
      if(typeof window==="undefined") return null;              // node 冒烟测试环境无 window
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = vol;
      master.connect(ctx.destination);
    }catch(e){ ctx=null; }
    return ctx;
  }
  function resume(){ const c=ctxGet(); if(c && c.state==="suspended") c.resume(); }
  // 单音 o = {f 起始频率, to 终止频率(可选·滑音), type 波形, dur 时长, gain 音量, delay 延迟}
  function note(o){
    if(!on) return;
    const c=ctxGet(); if(!c) return;
    const dur=o.dur||0.15, t0=c.currentTime+(o.delay||0);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(o.f, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.to), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,o.gain||0.25), t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  return {
    resume,
    setOn(v){ on=!!v; },
    isOn(){ return on; },
    setVol(v){ vol=v; if(master) master.gain.value=v; },
    getVol(){ return vol; },
    place(p){                                    // 落子：短促「啪」，双方音高不同便于分辨
      const lo = p ? 300 : 380;
      note({f: lo,   to: lo*0.62, type:"triangle", dur:0.13, gain:0.22});
      note({f: lo*2, to: lo*1.5,  type:"sine",     dur:0.09, gain:0.10, delay:0.01});
    },
    move(){                                      // 搬运：上滑音
      note({f:200, to:560, type:"sawtooth", dur:0.24, gain:0.12});
    },
    token(){                                     // 获得移动 token：明亮双音
      note({f:880,  type:"sine", dur:0.10, gain:0.16});
      note({f:1320, type:"sine", dur:0.15, gain:0.13, delay:0.09});
    },
    nope(){                                      // 非法操作：低沉短促
      note({f:150, to:90, type:"square", dur:0.16, gain:0.13});
    },
    click(){                                     // UI 点击
      note({f:680, type:"sine", dur:0.05, gain:0.09});
    },
    win(){  [523,659,784,1047].forEach((f,i)=>note({f, type:"triangle", dur:0.28, gain:0.19, delay:i*0.10})); },
    lose(){ [392,330,262,196].forEach((f,i)=>note({f, type:"sawtooth", dur:0.34, gain:0.14, delay:i*0.13})); }
  };
})();

/* ============================================================
   状态
   ============================================================ */
let state = null;
let mode = "ai";
let ui = { move:false, srcBox:null, ghost:null, ghostMv:null, hoverSrc:null };
let history = [];

function newState(){
  return {
    board: Array.from({length:BS},()=>Array(BS).fill(null)),
    placed: {},
    seq:0,
    current:0,
    round:1,
    turnId:0,
    players: [
      { placedCount:0, moves:0 },
      { placedCount:0, moves:0 }
    ],
    over:false, winner:-1,
    mustPlace:false      // true = 本回合已用过「移动」，必须再落一个 4×4 才算结束（r2.3）
  };
}
function cloneState(s){
  return {
    board: s.board.map(r=>r.map(c=> c?{...c}:null)),
    placed: Object.fromEntries(Object.entries(s.placed).map(([k,v])=>[k,{...v, cells:v.cells.map(p=>[...p])}])),
    seq:s.seq, current:s.current, round:s.round, over:s.over, winner:s.winner,
    turnId:s.turnId,
    mustPlace:!!s.mustPlace,
    players: s.players.map(p=>({placedCount:p.placedCount, moves:p.moves}))
  };
}
function log(msg, cls=""){
  const d=document.getElementById("log");
  const line=document.createElement("div");
  line.innerHTML = `<span class="t">#${state?state.round:''} </span>${msg}`;
  line.className=cls;
  d.appendChild(line); d.scrollTop=d.scrollHeight;
  if(d.children.length>80) d.removeChild(d.firstChild);
}

/* ============================================================
   规则引擎
   ============================================================ */
function anchorCells(r,c){
  const out=[];
  for(let dr=0;dr<P;dr++)for(let dc=0;dc<P;dc++) out.push([r+dr,c+dc]);
  return out;
}
function inBoard(r,c){ return r>=0 && r<BS && c>=0 && c<BS; }
function validAnchor(r,c){
  if(r<0||c<0||r+P>BS||c+P>BS) return false;
  return anchorCells(r,c).every(([rr,cc])=> !state.board[rr][cc]);
}
function allAnchors(){
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++) if(validAnchor(r,c)) res.push([r,c]);
  return res;
}
function canPlaceAny(){ return allAnchors().length>0; }
// 移动道具：目标 = 把某个对手方块搬到 (r,c) 后能放下（忽略该方块自身占的格）
function moveTargets(boxId){
  const b = state.placed[boxId];
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(const [rr,cc] of anchorCells(r,c)){
      if(!inBoard(rr,cc)){ ok=false; break; }
      const cell=state.board[rr][cc];
      if(cell && cell.boxId!==boxId){ ok=false; break; }
    }
    if(ok){
      const same = b.cells.length===P*P && b.cells.every(p=> p[0]>=r&&p[0]<r+P&&p[1]>=c&&p[1]<c+P);
      if(!same) res.push([r,c]);
    }
  }
  return res;
}
function oppBoxes(player){
  return Object.values(state.placed).filter(b=>b.owner===1-player);
}
// r2.3 关键约束：移动之后必须还能落一个方块。
// 所以只有「搬完之后自己仍有落位」的目标才是合法目标 —— 搬完自己也没地方落的走法
// 等价于自杀，直接从可选目标里过滤掉（与「放不下就不预览」同一个原则）。
function safeMoveTargets(boxId){
  return moveTargets(boxId).filter(([r,c])=> moveLeavesPlace(boxId,r,c));
}
function canMoveNow(player){
  if(state.players[player].moves<=0) return false;
  return oppBoxes(player).some(b=> safeMoveTargets(b.boxId).length>0);
}
function canAct(player){
  if(canPlaceAny()) return true;
  return canMoveNow(player);
}

/* ---- 动作 ---- */
function doPlace(p, r, c){
  const cells = anchorCells(r,c);
  const id = `${p}:sq:${state.seq++}`;
  state.placed[id] = { boxId:id, owner:p, cells, locked:false };
  cells.forEach(([rr,cc])=> state.board[rr][cc]={ boxId:id, owner:p });
  state.players[p].placedCount++;
  const SZ = `${P}×${P}`;
  if(state.players[p].placedCount % CONFIG.moveEvery === 0 && state.players[p].moves < CONFIG.moveMax){
    state.players[p].moves++;
    log(`<span class="p${p}c">${nameOf(p)}</span> 放下一个 ${SZ} 于 (${r+1},${c+1})，获得 1 个移动 token`);
    Sfx.place(p); Sfx.token();
  } else {
    log(`<span class="p${p}c">${nameOf(p)}</span> 放下一个 ${SZ} 于 (${r+1},${c+1})`);
    Sfx.place(p);
  }
}
function doMove(player, boxId, r, c){
  const b = state.placed[boxId];
  b.cells.forEach(([rr,cc])=> state.board[rr][cc]=null);
  const cells = anchorCells(r,c);
  b.cells = cells;
  cells.forEach(([rr,cc])=> state.board[rr][cc]={ boxId, owner:b.owner });
  state.players[player].moves--;
  log(`<span class="p${player}c">${nameOf(player)}</span> 把对手的 ${P}×${P} 搬到 (${r+1},${c+1})`);
  Sfx.move();
  // 核心判定：移动后若仍无落位，该玩家直接判负
  if(!canPlaceAny()){
    state.over = true;
    state.winner = 1 - player;
    render(); showWin();
    return "lost";
  }
  return "ok";
}
// 模拟：某个移动完成后，当前玩家是否仍有落位
function moveLeavesPlace(boxId,r,c){
  const s=cloneState(state);
  const b=s.placed[boxId];
  b.cells.forEach(([rr,cc])=> s.board[rr][cc]=null);
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId,owner:b.owner});
  for(let rr=0;rr<MAXA;rr++)for(let cc=0;cc<MAXA;cc++){
    let ok=true;
    for(const [ar,ac] of anchorCells(rr,cc)){
      if(!inBoard(ar,ac)||s.board[ar][ac]){ ok=false; break; }
    }
    if(ok) return true;
  }
  return false;
}

/* ---- 回合推进 ---- */
function advance(){
  if(state.over) return;
  state.current = 1 - state.current;
  state.round++;
  state.turnId++;               // 新回合：turnId 自增，用于悔棋定位
  state.mustPlace = false;      // 不变量：新回合一定从「落牌之前」开始
  resetUi();
  if(!canAct(state.current)){
    state.over=true;
    state.winner = 1 - state.current;
    render(); showWin();
    return;
  }
  // 无法放置但有移动 token：只有这一条路，且移动后得立刻补落一手
  if(!canPlaceAny() && canMoveNow(state.current)){
    setTip(`放不下 ${P}×${P} 了：只剩「移动」这一条路 —— 搬开对手方块后，你得能<b>立刻补落一个</b>，否则判负。`, true);
  }
  render();
  if(mode==="ai" && state.current===1 && !state.over){
    setTimeout(aiTurn, 520);
  }
}
// 悔棋快照：在「动作发生之前」记录当前局面，并打上 turnId。
// 同一回合内的多次动作（如「移动＋落子」连招）共享同一个 turnId，
// 这样一次 undo 就能把整手（含连招）完整退回，并交还给该手的主人。
function snapshot(){
  history.push({ turnId: state.turnId, s: cloneState(state) });
  if(history.length>80) history.shift();
}
function commitAction(){ advance(); }   // 仅推进回合；快照须由调用方在动作前调用

/* ---- AI（r2.4）----
   三层结构：
     1) 基础评分 scoreState = 锚点总数 ×1000 + 最大连通空域
        （双方同形，锚点公共，anchorsOn 分不出敌我，只能衡量空间）
     2) 候选生成：直接落子(~81 个) + 「移动+落子」连招（粗筛 Top-K 再深搜），
        连招要挣回 token 机会成本 AI_MOVE_COST 才值得
     3) 战术层 oppThreat（只看胜负级事件）：
        一手让对手无路 = 致胜手 (+WIN_TACTIC)，走出被将死的招 = (-WIN_TACTIC)  */
let AI_MOVE_COST = 6;   // 移动的机会成本，单位＝格数（调参面板可调）
let AI_TOPK = 8;        // 只对即时收益最好的 K 个移动候选做「移动+落子」深度搜索（可调）

function anchorsOn(s){
  let n=0;
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(let dr=0;dr<P&&ok;dr++)for(let dc=0;dc<P&&ok;dc++) if(s.board[r+dr][c+dc]) ok=false;
    if(ok) n++;
  }
  return n;
}
function canPlaceOn(s,r,c){
  for(let dr=0;dr<P;dr++)for(let dc=0;dc<P;dc++) if(s.board[r+dr][c+dc]) return false;
  return true;
}
function placeOn(s,r,c,owner){    // 原地修改模拟状态（AI=1，模拟对手落子传 0）
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId:"sim",owner:owner===undefined?1:owner});
  return s;
}
function simMove(boxId,r,c){
  const s=cloneState(state);
  const b=s.placed[boxId];
  b.cells.forEach(([rr,cc])=> s.board[rr][cc]=null);
  anchorCells(r,c).forEach(([rr,cc])=> s.board[rr][cc]={boxId,owner:b.owner});
  return s;
}
function scoreAfter(s){                // 局面里最大的一块连通空域
  const seen=new Set(); let max=0;
  for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){
    if(s.board[r][c] || seen.has(r+","+c)) continue;
    let q=[[r,c]],area=0; seen.add(r+","+c);
    while(q.length){ const [rr,cc]=q.pop(); area++;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
        const nr=rr+dr,nc=cc+dc;
        if(inBoard(nr,nc)&&!s.board[nr][nc]&&!seen.has(nr+","+nc)){ seen.add(nr+","+nc); q.push([nr,nc]); }
      });
    }
    if(area>max) max=area;
  }
  return max;
}
function scoreState(s){ return anchorsOn(s)*1000 + scoreAfter(s); }
/* ---- 战术层：一层对手回应 ----
   关键事实：双方方块同形，锚点是公共的 —— anchorsOn 分不出敌我，
   真正的攻防在「轮到谁时空间枯竭」。所以战术层只看胜负级事件：
     · 我这一手让对手无路（无落位且搬不出）→ 致胜手，巨大加分
     · 我这一手后对手存在反击让我无路     → 被将死，巨大减分   */
function anchorsList(s){
  const res=[];
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    let ok=true;
    for(let dr=0;dr<P&&ok;dr++)for(let dc=0;dc<P&&ok;dc++) if(s.board[r+dr][c+dc]) ok=false;
    if(ok) res.push([r,c]);
  }
  return res;
}
function canEscape(s,player){     // player 当前无落位：能否靠「移动」开出落位
  if(s.players[player].moves<=0) return false;
  for(const b of Object.values(s.placed)){
    if(b.owner!==1-player) continue;
    for(const [r,c] of anchorsList(s)){
      let ok=true;
      for(const [rr,cc] of anchorCells(r,c)){ const cell=s.board[rr][cc]; if(cell && cell.boxId!==b.boxId){ ok=false; break; } }
      if(!ok) continue;
      const s2=cloneState(s);
      const bb=s2.placed[b.boxId];
      bb.cells.forEach(([rr,cc])=> s2.board[rr][cc]=null);
      anchorCells(r,c).forEach(([rr,cc])=> s2.board[rr][cc]={boxId:b.boxId,owner:bb.owner});
      if(anchorsOn(s2)>0) return true;
    }
  }
  return false;
}
const WIN_TACTIC = 100000;        // 战术层分值：直接决定取舍
function oppThreat(s){            // s = 我方动作全部完成、即将轮到对手的局面
  if(anchorsOn(s)===0){
    return canEscape(s,0) ? 0 : WIN_TACTIC;            // 对手彻底无路 → 致胜
  }
  // 对手是否存在一手让我陷入死局
  for(const [r,c] of anchorsList(s)){
    const s2=placeOn(cloneState(s),r,c,0);
    if(anchorsOn(s2)===0 && !canEscape(s2,1)) return -WIN_TACTIC;   // 我被将死
  }
  return 0;
}
function bestFollowUp(s){          // 给定局面下，AI 自己能落的最佳位置
  let ret=null;
  for(let r=0;r<MAXA;r++)for(let c=0;c<MAXA;c++){
    if(!canPlaceOn(s,r,c)) continue;
    const sc=scoreState(placeOn(cloneState(s),r,c));
    if(!ret || sc>ret.score) ret={r,c,score:sc};
  }
  return ret;
}
function aiCandidates(){
  const list=[];
  for(const [r,c] of allAnchors()){
    const s1=placeOn(cloneState(state),r,c);
    list.push({type:'place', r, c, sAfter:s1, score:scoreState(s1)});
  }
  // 连招（移动＋落子）只在「自己已无处可落、被迫移动」时才考虑。
  // 能直接落子时，落子保留 token 永远更优——移动 token 是后手/劣势方的翻盘杠杆，
  // 不该在开局白白挪动对手刚放的方块。
  if(canMoveNow(1) && !canPlaceAny()){
    const rough=[];
    for(const b of oppBoxes(1)) for(const [mr,mc] of safeMoveTargets(b.boxId)){
      const s1=simMove(b.boxId,mr,mc);
      if(anchorsOn(s1)===0) continue;              // 兜底：自杀式移动不应出现
      rough.push({boxId:b.boxId, mr, mc, s1, score:scoreState(s1)});
    }
    rough.sort((x,y)=>y.score-x.score);            // 粗筛后再深搜，避免组合爆炸
    for(const cd of rough.slice(0,AI_TOPK)){
      const fu=bestFollowUp(cd.s1);
      if(fu) list.push({type:'combo', boxId:cd.boxId, mr:cd.mr, mc:cd.mc,
                        pr:fu.r, pc:fu.c, sAfter:placeOn(cloneState(cd.s1),fu.r,fu.c), score:fu.score});
    }
  }
  return list;
}
let AI_LOOKAHEAD = 4;    // 只对基础分最高的 N 个候选做对手回应检查（调参面板可调）
function aiTurn(){
  if(state.over) return;
  const cands=aiCandidates();
  if(!cands.length){ state.over=true; state.winner=0; render(); showWin(); return; }
  cands.sort((x,y)=>y.score-x.score);
  let best=null;
  cands.forEach((cd,i)=>{
    cd.final = cd.score - (cd.type==='combo'?AI_MOVE_COST:0)
             + (i<AI_LOOKAHEAD ? oppThreat(cd.sAfter) : 0);   // 战术层只看头部候选
    if(!best || cd.final>best.final) best=cd;
  });
  if(best.type==='combo'){
    snapshot();
    if(doMove(1, best.boxId, best.mr, best.mc)==="lost"){ resetUi(); return; }
    state.mustPlace=true; resetUi(); render();
    setTimeout(()=>{
      // 若期间被悔棋/重开，状态已变，放弃这手
      if(state.over || state.current!==1 || !state.mustPlace) return;
      if(!canPlaceOn(state, best.pr, best.pc)) return;
      snapshot();                                  // 连招第二手：与移动共享同一 turnId，整手可一次退回
      doPlace(1, best.pr, best.pc);
      state.mustPlace=false; resetUi(); advance();
    }, 520);
    return;
  }
  snapshot(); doPlace(1, best.r, best.c); resetUi(); advance();
}

/* ============================================================
   渲染
   ============================================================ */
const boardEl=document.getElementById("board");
function render(){ renderBoard(); renderPlayers(); renderStatus(); paintGhost(); fitBoard(); }
let _mvCache={};
function renderBoard(){
  boardEl.style.gridTemplateColumns = `repeat(${BS},1fr)`;
  boardEl.style.gridTemplateRows    = `repeat(${BS},1fr)`;
  boardEl.innerHTML="";
  _mvCache={};
  const boundsCache={};
  for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){
    const d=document.createElement("div");
    d.dataset.r=r; d.dataset.c=c;
    const cell=state.board[r][c];
    if(cell){
      d.className="cell placed"+cell.owner;
      let b=boundsCache[cell.boxId];
      if(!b){
        const box=state.placed[cell.boxId];
        let minR=BS,minC=BS,maxR=0,maxC=0;
        for(const [rr,cc] of box.cells){ minR=Math.min(minR,rr); minC=Math.min(minC,cc); maxR=Math.max(maxR,rr); maxC=Math.max(maxC,cc); }
        b=boundsCache[cell.boxId]={minR,minC,maxR,maxC};
      }
      if(r===b.minR) d.classList.add("edge-t");
      if(r===b.maxR) d.classList.add("edge-b");
      if(c===b.minC) d.classList.add("edge-l");
      if(c===b.maxC) d.classList.add("edge-r");
      if(ui.move && ui.srcBox===null && cell.owner===1-state.current){
        if(!(cell.boxId in _mvCache)) _mvCache[cell.boxId] = safeMoveTargets(cell.boxId).length>0;
        d.classList.add(_mvCache[cell.boxId] ? "mvsrc" : "mvnomove");
      }
      if(ui.move && ui.srcBox!==null && cell.boxId===ui.srcBox){
        d.classList.add("mvsrc");
        // 关键：目标锚点可能就在方块自身内部（平移一格的场景），这些格子也要显示目标高亮
        if(isMoveTargetCell(r,c)) d.classList.add("mvtgt");
      }
    } else {
      d.className="cell empty";
      if(!ui.move && validAnchor(r,c)) d.classList.add("anchor");
      if(ui.move && ui.srcBox!==null && isMoveTargetCell(r,c)) d.classList.add("mvtgt");
    }
    d.addEventListener("click",()=> onCellClick(r,c));
    boardEl.appendChild(d);
  }
}
function isMoveTargetCell(r,c){
  if(!ui.srcBox) return false;
  for(const [rr,cc] of safeMoveTargets(ui.srcBox)){
    if(rr===r && cc===c) return true;
  }
  return false;
}
/* ---- 落子幽灵预览 ----
   规则：预览位置 == 点击后的真实落点。
   鼠标所在格 (r,c) 直接作为 4×4 的左上角；只有该位置能完整放下才画幽灵。
   放不下的位置一律不预览（所见即所得，点了必然能下）。            */
function updateGhost(r,c){
  ui.ghost=null; ui.ghostMv=null; ui.hoverSrc=null;
  const idle = state.over || (mode==="ai" && state.current===1);
  if(!idle && ui.move && ui.srcBox!==null){
    // 移动模式已选源方块：预览搬到 (r,c) 后的样子，同样只画合法目标
    if(safeMoveTargets(ui.srcBox).some(([rr,cc])=> rr===r && cc===c)) ui.ghostMv={r,c};
  } else if(!idle && ui.move){
    // 移动模式待选源：高亮鼠标下那个可被搬动的对手方块
    const cell=state.board[r][c];
    if(cell && cell.owner===1-state.current && safeMoveTargets(cell.boxId).length>0) ui.hoverSrc=cell.boxId;
  } else if(!idle && validAnchor(r,c)){
    ui.ghost={r,c};
  }
  paintGhost();
}
function paintGhost(){
  // 状态变化后旧的幽灵可能已失效（例如 AI 刚占了那块地）
  if(ui.ghost && !validAnchor(ui.ghost.r, ui.ghost.c)) ui.ghost=null;
  if(ui.ghostMv && ui.srcBox && !safeMoveTargets(ui.srcBox).some(([rr,cc])=>rr===ui.ghostMv.r&&cc===ui.ghostMv.c)) ui.ghostMv=null;
  const g = ui.ghost || ui.ghostMv;
  for(const d of boardEl.children){
    const rr=+d.dataset.r, cc=+d.dataset.c;
    const on = !!g && rr>=g.r && rr<g.r+P && cc>=g.c && cc<g.c+P;
    d.classList.toggle("ghost", !!ui.ghost && on);
    d.classList.toggle("ghostmv", !!ui.ghostMv && on);
    d.classList.toggle("origin", !!g && rr===g.r && cc===g.c);
    d.classList.toggle("hoverSrc", !!ui.hoverSrc && !!state.board[rr][cc] && state.board[rr][cc].boxId===ui.hoverSrc);
  }
}
// 让棋盘始终是「容器宽 / 容器高」中较小值的正方形 —— 适配任意窗口，不溢出、不滚动
function fitBoard(){
  const wrap = boardEl && boardEl.parentElement;
  if(!wrap) return;
  const cs = (typeof getComputedStyle==="function") ? getComputedStyle(wrap) : null;
  const padX = cs ? (parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)) : 20;
  const padY = cs ? (parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)) : 20;
  const availW = (wrap.clientWidth||wrap.offsetWidth||0) - padX;
  const availH = (wrap.clientHeight||wrap.offsetHeight||0) - padY;
  const size = Math.max(80, Math.floor(Math.min(availW, availH)));
  boardEl.style.width = size+"px";
  boardEl.style.height = size+"px";
}

/* ============================================================
   自适应布局（棋盘最大化优先）
     原则：棋盘先取「容器短边」撑到的最大正方形 —— 只随窗口尺寸/比例变化，
           绝不因下方/侧边文字变多而变小；内容变化时信息区内部滚动。
     然后看棋盘之外剩下的「一条」空间：
        · 右侧竖条够宽  → 停靠右侧（竖向一列）
        · 下方横条够高  → 停靠底部（横向换行）
        · 两条都不够（近方形窗口）→ 折叠成悬浮按钮，点开是浮层
   ============================================================ */
const Layout = (function(){
  const GAP = 8;            // .main 的 gap
  const PAD = 10;           // .boardWrap 的 padding
  const MIN_SIDE = 216;     // 右侧竖条：至少要这么宽才塞得下信息
  const MIN_BOTTOM = 120;   // 下方横条：至少要这么高才塞得下信息（能露出控制+状态两行，其余滚动）
  const MAX_SIDE = 360;     // 竖条上限（超出部分留给棋盘两侧的呼吸空间）
  const MAX_BOTTOM = 240;   // 横条上限
  let lastKey = "", raf = 0, curDock = "side";

  function q(id){ return document.getElementById(id); }
  function openPanel(open){ const ov=q("infoOverlay"); if(ov) ov.classList.toggle("open", !!open); }
  function isOpen(){ const ov=q("infoOverlay"); return !!ov && ov.classList.contains("open"); }

  // 纯计算：给定 mainArea 的内容区尺寸 → 棋盘最大外径 + 信息区停靠方式与尺寸。
  // 不变量：棋盘永远等于「短边 - 2*PAD」，信息区只分到剩下的那一条。
  function plan(W, H){
    const boardMax = Math.max(80, Math.min(W, H) - PAD*2);
    const stripSide   = W - GAP - (boardMax + PAD*2);   // 剩下的竖条（放在右侧时）宽度
    const stripBottom = H - GAP - (boardMax + PAD*2);   // 剩下的横条（放在下方时）高度
    const dock = (stripSide >= MIN_SIDE) ? "side"
               : (stripBottom >= MIN_BOTTOM) ? "bottom"
               : "overlay";
    const sideW   = dock==="side"   ? Math.min(Math.round(stripSide),   MAX_SIDE)   : 0;
    const bottomH = dock==="bottom" ? Math.min(Math.round(stripBottom), MAX_BOTTOM) : 0;
    return { board: boardMax, dock, sideW, bottomH, stripSide, stripBottom };
  }

  function compute(){
    const app=q("app"), main=q("mainArea"), info=q("infobar"), wrap=q("boardWrap"), body=q("infoBody");
    if(!app || !main || !info || !wrap || !boardEl) return;
    const cs = (typeof getComputedStyle==="function") ? getComputedStyle(main) : null;
    const W = main.clientWidth  - (cs ? parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight) : 0);
    const H = main.clientHeight - (cs ? parseFloat(cs.paddingTop) +parseFloat(cs.paddingBottom): 0);
    if(!(W>0) || !(H>0)) return;

    // 1) 棋盘优先：取容器短边允许的最大正方形
    const p = plan(W, H);
    const key = Math.round(W)+"x"+Math.round(H)+"@"+p.dock;
    if(key === lastKey) return;
    lastKey = key;
    curDock = p.dock;

    // 2) 剩下的那一条交给信息区；两条都不够 → 折叠成浮层
    app.classList.remove("dock-side","dock-bottom","dock-overlay");
    app.classList.add("dock-"+p.dock);

    if(p.dock === "overlay"){
      // 信息整块搬进底部浮层；棋盘独占 mainArea
      if(body && info.parentNode !== body) body.appendChild(info);
      info.classList.remove("col"); info.classList.add("row");   // 底部浮层内两列分配
      info.style.width = ""; info.style.height = "";
      main.style.flexDirection = "row";
    }else if(p.dock === "side"){
      if(info.parentNode !== main) main.appendChild(info);
      if(isOpen()) openPanel(false);
      info.classList.remove("row"); info.classList.add("col");
      info.style.width  = p.sideW+"px";
      info.style.height = "";
      main.style.flexDirection = "row";
    }else{
      if(info.parentNode !== main) main.appendChild(info);
      if(isOpen()) openPanel(false);
      info.classList.remove("col"); info.classList.add("row");
      info.style.height = p.bottomH+"px";
      info.style.width  = "";
      main.style.flexDirection = "column";
    }
    fitBoard();
  }

  function apply(){
    if(typeof window === "undefined") return;
    if(raf) return;
    const sch = window.requestAnimationFrame || function(f){ return window.setTimeout(f,16); };
    raf = sch(function(){ raf = 0; compute(); });
  }

  function init(){
    // 启动时先同步算一次（避免首帧按默认 dock-side 闪一下），再挂监听
    compute();
    const btn = q("infoToggle"), ov = q("infoOverlay"), close = q("infoClose");
    if(btn)   btn.addEventListener("click", ()=>openPanel(!isOpen()));
    if(close) close.addEventListener("click", ()=>openPanel(false));
    if(ov)    ov.addEventListener("click", e=>{ if(e.target === ov) openPanel(false); });
    window.addEventListener("keydown", e=>{ if(e.key === "Escape") openPanel(false); });
    window.addEventListener("resize", apply);
    window.addEventListener("load", apply);
    window.addEventListener("orientationchange", apply);
    if(window.ResizeObserver && q("mainArea")){ new ResizeObserver(apply).observe(q("mainArea")); }
    if(window.ResizeObserver && q("boardWrap")){ new ResizeObserver(apply).observe(q("boardWrap")); }
    // 调参面板展开/收起不改变信息区尺寸（内部滚动），无需重算；但仍保险地重算一次
    const tp = q("tunePanel");
    if(tp) tp.addEventListener("toggle", ()=>setTimeout(apply, 30));
    apply();
  }

  return { apply, plan, init, dock(){ return curDock; }, open: ()=>openPanel(true), close: ()=>openPanel(false) };
})();
if(typeof window!=="undefined"){
  Layout.init();
}

function onCellClick(r,c){
  if(state.over) return;
  const p=state.current;
  if(mode==="ai" && p===1) return;
  if(state.mustPlace){
    if(ui.move){ ui.move=false; ui.srcBox=null; }
    if(state.board[r][c]){ tipErr("这里已经有方块了"); return; }
    if(!validAnchor(r,c)){ tipErr(`这里放不下 ${P}×${P}：请选择<b>带绿色圆点</b>的格子`); return; }
    snapshot(); doPlace(p, r, c); state.mustPlace=false; resetUi(); advance(); return;
  }
  if(ui.move){
    if(ui.srcBox===null){
      const cell=state.board[r][c];
      if(cell && cell.owner===1-p){
        if(safeMoveTargets(cell.boxId).length===0){
          tipErr("这枚方块搬走后你没地方落子（会判负），不能选它；换一枚<b>金色虚线</b>的可搬方块"); return;
        }
        ui.srcBox=cell.boxId;
        setTip("已选中对手的方块：再点一个<b>金色高亮</b>的位置把它搬过去（该格 = 新左上角，<b>可以落在方块自身内部</b>）。");
        render(); return;
      }
      tipErr("请先点<b>对手</b>的方块（金色虚线框的那个）"); return;
    } else {
      const cell=state.board[r][c];
      // —— 点在当前选中的源方块内部：确认或解释，绝不悄悄取消选择 ——
      //    （锚点允许落在方块自身上：平移一格时新左上角就在原方块内部）
      if(cell && cell.boxId===ui.srcBox){
        if(safeMoveTargets(ui.srcBox).some(([rr,cc])=> rr===r && cc===c)){
          snapshot();                                  // 悔棋点：可退回移动之前
          const res = doMove(p, ui.srcBox, r, c);
          resetUi();
          if(res==="lost") return;                     // 移动后仍无落位：直接判负
          state.mustPlace=true;                        // 本回合还能再落一个方块
          setTip(mustPlaceTip());
          render(); return;
        }
        const cur=state.placed[ui.srcBox].cells[0];
        if(r===cur[0] && c===cur[1]){
          tipErr("这就是它现在的位置 —— 请点<b>金色高亮</b>的格子（包括方块内部的高亮格）作为新左上角");
        }else{
          tipErr("这个格不能当锚点：只有<b>金色高亮</b>的格子才行（方块内部的高亮格也可以）");
        }
        render(); return;                              // 保持选中，让用户继续点
      }
      // —— 点在另一枚对手方块上：直接改选，省一次点击 ——
      if(cell && cell.owner===1-p){
        if(safeMoveTargets(cell.boxId).length===0){
          tipErr("这枚方块搬走后你没地方落子（会判负），不能选它"); render(); return;
        }
        ui.srcBox=cell.boxId;
        setTip("已改选这枚方块：再点一个<b>金色高亮</b>的位置搬过去（锚点可以在方块自身内部）。");
        render(); return;
      }
      if(safeMoveTargets(ui.srcBox).some(([rr,cc])=> rr===r && cc===c)){
        snapshot();                                    // 悔棋点：可退回移动之前
        const res = doMove(p, ui.srcBox, r, c);
        resetUi();
        if(res==="lost") return;                       // 移动后仍无落位：直接判负
        state.mustPlace=true;                          // 本回合还能再落一个方块
        setTip(mustPlaceTip());
        render(); return;
      }
      tipErr("那里搬不过去：只能搬到<b>金色高亮</b>的位置（点其他对手方块可改选；点空白处取消移动）");
      ui.srcBox=null; render(); return;
    }
  }
  if(state.board[r][c]){ tipErr("这里已经有方块了"); return; }
  if(!validAnchor(r,c)){
    tipErr(`这里放不下 ${P}×${P}：以 (${r+1},${c+1}) 为左上角会越界或被占。请选择<b>带绿色圆点</b>的格子`);
    return;
  }
  snapshot(); doPlace(p, r, c); resetUi(); advance();
}
function renderPlayers(){
  const wrap=document.getElementById("players");
  wrap.innerHTML="";
  [0,1].forEach(p=>{
    const ph=state.players[p];
    const own = p===state.current && !(mode==="ai"&&p===1);
    const chained = state.mustPlace && state.current===p;   // 已用移动，正在等待补落的那一手
    const el=document.createElement("div");
    el.className="pcard f"+p+(state.current===p?" active":"");
    el.innerHTML=`
      <span class="dot"></span>
      <span class="pn">${nameOf(p)}</span>
      <span class="pc">落 ${ph.placedCount}</span>
      <button class="chip ${ui.move&&state.current===p?'live':(ph.moves>0&&own&&!chained?'ready':'off')}">移 ${ph.moves}</button>
      ${chained?`<span class="mustTip" style="margin:0">须再落一子</span>`:``}`;
    const btn=el.querySelector(".chip");
    btn.addEventListener("click",()=>{
      if(!own) return;
      if(chained){ flash(btn,"本回合已用过移动"); return; }
      if(ph.moves<=0){ flash(btn,"没有移动 token"); return; }
      if(oppBoxes(p).length===0){ flash(btn,"对手还没有方块"); return; }
      if(!canMoveNow(p)){ flash(btn,"没有可搬动的位置"); return; }
      ui.move=true; ui.srcBox=null;
      setTip("【移动】先点一个<b>对手</b>的方块（金色虚线框），再点一个<b>金色高亮</b>的位置搬过去 —— 锚点也可以在方块自身内部（平移）。");
      render();
    });
    wrap.appendChild(el);
  });
}

function startGame(){

  state=newState();
  state.players[1].moves = CONFIG.secondStartMove; // 后手补 1 移动 token
  document.getElementById("winOverlay").classList.add("hidden");
  document.getElementById("log").innerHTML="";

function undo(){
  if(history.length===0) return;
  let targetTurn;
  if(mode==="ai"){
    // 对战 AI：一路退回「人类（玩家0）最近一次行动之前」，把 AI 的回应一并退回
    let t=-1;
    for(const h of history) if(h.s.current===0) t=h.turnId;
    targetTurn=t;
  } else {
    // 双人对阵：退回最近完成的一手（不论红蓝），整手（含连招）一次退清
    targetTurn = history[history.length-1].turnId;
  }
  if(targetTurn<0) return;
  let idx=0;
  while(idx<history.length && history[idx].turnId!==targetTurn) idx++;
  if(idx>=history.length) return;
  const snap = history[idx];                 // 该手「行动之前」的起点
  history = history.slice(0, idx);           // 连同起点一起丢弃，起点即当前局面
  state = cloneState(snap.s);
  state.over=false;                          // 若上一手已判负，悔棋可救回
  state.winner=-1;
  document.getElementById("winOverlay").classList.add("hidden");
  resetUi(); render();
  log("悔棋：退回上一步之前","");
}

/* ============================================================
   调参面板：规则与 AI 参数全部开放
   · 棋盘边长 / 方块边长 / 移动规则：改完重开一局（棋盘要重建）
   · AI 参数：下一次 aiTurn 立即生效
   · 全部写入 localStorage，刷新后自动恢复
   ============================================================ */
const TUNE_KEY = "packing-duel-tune-v1";
function gid(id){ return document.getElementById(id); }
function clampNum(v, lo, hi){ v = Number(v); return (!isFinite(v)) ? lo : (v<lo?lo : v>hi?hi : v); }
function tuneSet(inId, valId, val){
  const a = gid(inId), b = gid(valId);
  if(a) a.value = String(val);
  if(b) b.textContent = String(val);
}
function saveTune(){
  try{
    localStorage.setItem(TUNE_KEY, JSON.stringify({
      cfg: CONFIG, look: AI_LOOKAHEAD, topk: AI_TOPK, cost: AI_MOVE_COST,
      sound: Sfx.isOn(), vol: Sfx.getVol()
    }));
  }catch(e){}                                        // node 环境无 localStorage
}
function loadTune(){
  try{
    const raw = localStorage.getItem(TUNE_KEY); if(!raw) return;
    const o = JSON.parse(raw); if(!o || !o.cfg) return;
    CONFIG.boardSize       = clampNum(o.cfg.boardSize, 12, 18);
    CONFIG.piece           = clampNum(o.cfg.piece, 3, 5);
    CONFIG.moveEvery       = clampNum(o.cfg.moveEvery, 1, 4);
    CONFIG.moveMax         = clampNum(o.cfg.moveMax, 0, 5);
    CONFIG.secondStartMove = clampNum(o.cfg.secondStartMove, 0, 3);
    AI_LOOKAHEAD = clampNum(o.look, 0, 12);
    AI_TOPK      = clampNum(o.topk, 1, 16);
    AI_MOVE_COST = clampNum(o.cost, 0, 20);
    Sfx.setOn(o.sound !== false);
    Sfx.setVol(o.vol != null ? clampNum(o.vol, 0, 1) : 0.5);   // 缺省保持默认音量，别被静音
    recalcDims();
  }catch(e){}
}
function syncTuneUI(){
  tuneSet("tBS","vBS", CONFIG.boardSize);
  tuneSet("tP", "vP",  CONFIG.piece);
  tuneSet("tME","vME", CONFIG.moveEvery);
  tuneSet("tMM","vMM", CONFIG.moveMax);
  tuneSet("tSS","vSS", CONFIG.secondStartMove);
  tuneSet("tMC","vMC", AI_MOVE_COST);
  tuneSet("tTK","vTK", AI_TOPK);
  tuneSet("tLA","vLA", AI_LOOKAHEAD);
  tuneSet("tVol","vVol", Math.round(Sfx.getVol()*100));
  const sb = gid("tSound");
  if(sb){
    sb.textContent = Sfx.isOn() ? "🔊 开" : "🔇 关";
    sb.classList.toggle("off", !Sfx.isOn());
  }
  const tag = gid("cfgTag");
  if(tag) tag.textContent = `${BS}×${BS} · ${P}×${P} · 放不下判负 · 移动可续落`;
}
// 棋盘/方块/移动规则：拖动中只刷读数，松手(change)才重开，避免频繁重建
[["tBS","boardSize"],["tP","piece"],["tME","moveEvery"],["tMM","moveMax"],["tSS","secondStartMove"]]
.forEach(([id, key])=>{
  const el = gid(id); if(!el) return;
  el.addEventListener("input", ()=>{ gid("v"+id.slice(1)).textContent = el.value; });
  el.addEventListener("change", ()=>{
    CONFIG[key] = Number(el.value);
    recalcDims(); syncTuneUI(); saveTune(); Sfx.click(); startGame();
  });
});
// AI 参数：下一次 AI 出手即生效，无需重开
[["tMC", v=>AI_MOVE_COST=v], ["tTK", v=>AI_TOPK=v], ["tLA", v=>AI_LOOKAHEAD=v]]
.forEach(([id, setter])=>{
  const el = gid(id); if(!el) return;
  el.addEventListener("input", ()=>{
    setter(Number(el.value)); gid("v"+id.slice(1)).textContent = el.value;
    syncTuneUI(); saveTune();
  });
});
(()=>{                                               // 音量（松手试听一声）
  const el = gid("tVol"); if(!el) return;
  el.addEventListener("input",  ()=>{ Sfx.setVol(Number(el.value)/100); gid("vVol").textContent = el.value; saveTune(); });
  el.addEventListener("change", ()=> Sfx.click());
})();
(()=>{                                               // 音效开关
  const el = gid("tSound"); if(!el) return;
  el.addEventListener("click", ()=>{
    Sfx.setOn(!Sfx.isOn()); syncTuneUI(); saveTune();
    if(Sfx.isOn()) Sfx.click();                      // 刚打开时给一声确认
  });
})();
(()=>{                                               // 恢复默认
  const el = gid("tReset"); if(!el) return;
  el.addEventListener("click", ()=>{
    Object.assign(CONFIG, CONFIG_DEFAULTS);
    AI_LOOKAHEAD = 4; AI_TOPK = 8; AI_MOVE_COST = 6;
    recalcDims(); syncTuneUI(); saveTune(); Sfx.click(); startGame();
  });
})();
// UI 点击统一「嗒」声（捕获阶段，早于业务处理）
document.addEventListener("click", e=>{
  const t = e.target;
  if(t && t.closest && t.closest("button, summary, .chip, .modeSel span")) Sfx.click();
}, true);
// 浏览器要求首个用户手势之后才允许出声
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev, ()=> Sfx.resume(), {passive:true})
);

loadTune();
syncTuneUI();

startGame();
</script>
</body>
</html>
